<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Register</title>
</head>

<body>

    <h1>Registration Form</h1>

    {% if form and form.errors %}
        <ul>
            {% for error in form.errors %}
                <li>{{ error }}</li>
            {% endfor %}
        </ul>
    {% endif %}

    <form action="/register" method="POST">

        <label for="first_name">First name:</label>
        <input type="text" id="first_name" name="first_name" value="{{form.first_name if form else ''}}">

        <label for="last_name">Last name:</label>
        <input type="text" id="last_name" name="last_name" value="{{form.last_name if form else ''}}">

        <label for="username">Username:</label>
        <input type="text" id="username" name="username" value="{{form.username if form else ''}}">

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" value="{{form.email if form else ''}}">

        <label for="password">Password:</label>
        <input type="password" id="password" name="password">

        <label for="confirm_password">Confirm password:</label>
        <input type="password" id="confirm_password" name="confirm_password">

        <button type="submit">Register</button>

    </form>

</body>

</html>
